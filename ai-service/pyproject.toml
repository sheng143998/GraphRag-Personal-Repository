[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI AI/RAG service skeleton for the monorepo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.137.2",
  "langchain==1.3.9",
  "langchain-core==1.4.7",
  "langgraph==1.2.5",
  "pg8000>=1.31.0,<2.0.0",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-docx>=1.1.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../.tmp/pytest-cache/ai-service"
