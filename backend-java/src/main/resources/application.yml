spring:
  application:
    name: agent-knowledge-backend
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_knowledge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:180s}
    mock-enabled: ${AI_SERVICE_MOCK_ENABLED:false}
  document-ingest:
    mode: ${DOCUMENT_INGEST_MODE:local}
    exchange: ${DOCUMENT_INGEST_EXCHANGE:document.ingest.exchange}
    queue: ${DOCUMENT_INGEST_QUEUE:document.ingest.queue}
    routing-key: ${DOCUMENT_INGEST_ROUTING_KEY:document.ingest}
